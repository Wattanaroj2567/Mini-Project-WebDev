{% extends "base.html" %}
{% block title %}ตั้งรหัสผ่านใหม่ | EventRegis+{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-8" style="background-color: #F1F0E8;">
    <div class="w-full max-w-md">
        <div class="card bg-white shadow-xl rounded-2xl">
            <div class="card-body p-10">
                <h1 class="text-2xl md:text-3xl font-semibold mb-8" style="color: #2C3E50;">ตั้งรหัสผ่านใหม่</h1>

                <form method="post" action="" x-data="{ submitting: false }" @submit="submitting = true">
                    {% csrf_token %}

                    <!-- New Password -->
                    <div class="form-control mb-6">
                        <label class="label" for="id_password1">
                            <span class="label-text font-medium" style="color: #2C3E50;">รหัสผ่านใหม่</span>
                        </label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-lg"
                                style="color: #89A8B2;">🔐</span>
                            <input type="password" name="password1" id="id_password1"
                                class="input input-bordered w-full pl-12 focus:input-primary transition-all duration-300"
                                style="background-color: #F1F0E8; border-color: transparent;" placeholder="รหัสผ่านใหม่"
                                required />
                        </div>
                        {% if form.password1.errors %}
                        <label class="label">
                            <span class="label-text-alt text-error">{{ form.password1.errors.0 }}</span>
                        </label>
                        {% endif %}
                    </div>

                    <!-- Confirm New Password -->
                    <div class="form-control mb-8">
                        <label class="label" for="id_password2">
                            <span class="label-text font-medium" style="color: #2C3E50;">ยืนยันรหัสผ่านใหม่</span>
                        </label>
                        <div class="relative">
                            <span class="absolute left-4 top-1/2 transform -translate-y-1/2 text-lg"
                                style="color: #89A8B2;">✅</span>
                            <input type="password" name="password2" id="id_password2"
                                class="input input-bordered w-full pl-12 focus:input-primary transition-all duration-300"
                                style="background-color: #F1F0E8; border-color: transparent;"
                                placeholder="ยืนยันรหัสผ่านใหม่" required />
                        </div>
                        {% if form.password2.errors %}
                        <label class="label">
                            <span class="label-text-alt text-error">{{ form.password2.errors.0 }}</span>
                        </label>
                        {% endif %}
                    </div>

                    <button type="submit"
                        class="btn w-full text-white text-lg font-semibold hover:opacity-90 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg"
                        style="background-color: #89A8B2; color: #F1F0E8;" :class="{ 'loading': submitting }">
                        <span x-show="!submitting">ตั้งรหัสผ่านใหม่</span>
                        <span x-show="submitting">กำลังตั้งรหัสผ่าน...</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
