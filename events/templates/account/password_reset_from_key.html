{% extends "base.html" %}

    <h1 class="text-2xl font-bold mb-6">ตั้งรหัสผ่านใหม่</h1>
    <form method="post" action="">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}

        <div class="form-control mt-6">
            <button type="submit" class="btn btn-primary">ตั้งรหัสผ่านใหม่</button>
        </div>
    </form>
</div>
{% endblock %}
