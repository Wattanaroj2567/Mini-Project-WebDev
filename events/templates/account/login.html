{% extends "base.html" %}

{% block content %}
<div class="hero min-h-screen bg-base-200">
    <div class="hero-content flex-col lg:flex-row-reverse">
        <div class="text-center lg:text-left">
            <h1 class="text-5xl font-bold">Login now!</h1>
            <p class="py-6">เข้าสู่ระบบเพื่อจัดการและเข้าร่วมกิจกรรมของคุณ</p>
        </div>
        <div class="card shrink-0 w-full max-w-sm shadow-2xl bg-base-100">
            <form class="card-body" method="post" action="{% url 'account_login' %}">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary">Login</button>
                </div>

                <div class="text-center mt-2">
                    <a href="{% url 'account_reset_password' %}" class="link link-hover text-sm">ลืมรหัสผ่าน?</a>
                </div>

                <div class="divider">OR</div>

                <!-- Google Login Button -->
                <a href="{% url 'google_login' %}" class="btn btn-neutral">
                    Sign in with Google
                </a>

                <div class="text-center mt-4">
                    <a href="{% url 'account_signup' %}" class="link">ยังไม่มีบัญชี? สมัครสมาชิก</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
