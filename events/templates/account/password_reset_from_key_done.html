{% extends "base.html" %}
{% block title %}ตั้งรหัสผ่านใหม่สำเร็จ | EventRegis+{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-8" style="background-color: #F1F0E8;">
    <div class="w-full max-w-md">
        <div class="card bg-white shadow-xl rounded-2xl">
            <div class="card-body p-10 text-center">
                <div class="text-6xl mb-6 opacity-80">🎉</div>

                <h1 class="text-2xl md:text-3xl font-semibold mb-6" style="color: #2C3E50;">ตั้งรหัสผ่านใหม่สำเร็จ!</h1>

                <p class="text-base leading-relaxed mb-8" style="color: #5a6c7d;">
                    รหัสผ่านของคุณถูกเปลี่ยนเรียบร้อยแล้ว ตอนนี้คุณสามารถเข้าสู่ระบบด้วยรหัสผ่านใหม่ได้เลย
                </p>

                <a href="{% url 'account_login' %}"
                    class="btn btn-primary btn-lg hover:bg-blue-600 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg">
                    ไปยังหน้าล็อกอิน
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
