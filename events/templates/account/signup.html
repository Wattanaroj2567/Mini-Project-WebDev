{% extends "base.html" %}

{% block content %}
<div class="hero min-h-screen bg-base-200">
    <div class="hero-content flex-col lg:flex-row-reverse">
        <div class="text-center lg:text-left">
            <h1 class="text-5xl font-bold">Sign up now!</h1>
            <p class="py-6">สร้างบัญชีเพื่อเริ่มลงทะเบียนและสร้างกิจกรรมของคุณ</p>
        </div>
        <div class="card shrink-0 w-full max-w-sm shadow-2xl bg-base-100">
            <form class="card-body" method="post" action="{% url 'account_signup' %}">
                {% csrf_token %}

                <!-- Django allauth form fields will be rendered here -->
                {{ form.as_p }}

                <div class="form-control mt-6">
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </div>
                <div class="text-center mt-4">
                    <a href="{% url 'account_login' %}" class="link">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
