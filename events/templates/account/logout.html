{% extends "base.html" %}
{% load static %}
{% block title %}ออกจากระบบ | EventRegis+{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-8" style="background-color: #F1F0E8;">
  <div class="w-full max-w-md">
    <div class="card bg-white shadow-xl rounded-2xl">
      <div class="card-body p-10 text-center">
        <div class="text-6xl mb-6 opacity-80">👋</div>

        <h1 class="text-2xl md:text-3xl font-semibold mb-4" style="color: #2C3E50;">ออกจากระบบ</h1>

        <p class="text-base leading-relaxed mb-8" style="color: #5a6c7d;">
          คุณแน่ใจหรือไม่ว่าต้องการออกจากระบบ?
        </p>

        <form method="post" action="{% url 'account_logout' %}" x-data="{ submitting: false }"
          @submit="submitting = true">
          {% csrf_token %}
          <div class="flex flex-col sm:flex-row gap-4">
            <button type="submit"
              class="btn btn-error flex-1 text-white hover:bg-pink-600 transition-all duration-300 hover:-translate-y-0.5 hover:shadow-lg"
              :class="{ 'loading': submitting }">
              <span x-show="!submitting">ใช่, ออกจากระบบ</span>
              <span x-show="submitting">กำลังออกจากระบบ...</span>
            </button>
            <a href="/" class="btn btn-outline flex-1 text-gray-700 hover:bg-gray-100 transition-all duration-300">
              ยกเลิก
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
