{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-8 bg-base-100 rounded-lg shadow-xl text-center">
    <h1 class="text-2xl font-bold mb-4">ลืมรหัสผ่าน?</h1>
    <p class="mb-6">กรุณากรอกอีเมลของคุณเพื่อตั้งรหัสผ่านใหม่ เราจะส่งคำแนะนำไปให้</p>
    <form method="post" action="{% url 'account_reset_password' %}">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        <div class="form-control mt-6">
            <button type="submit" class="btn btn-primary">ส่งอีเมลรีเซ็ตรหัสผ่าน</button>
        </div>
    </form>
</div>
{% endblock %}
