{% extends "base.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-10 p-8 bg-base-100 rounded-lg shadow-xl">
    <h1 class="text-2xl font-bold mb-6">เปลี่ยนรหัสผ่าน</h1>
    <p class="mb-6">กรุณากรอกรหัสผ่านเก่าของคุณ และตั้งรหัสผ่านใหม่</p>

    <form method="post" action="{% url 'account_change_password' %}">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>
        <div class="form-control mt-6">
            <button type="submit" class="btn btn-primary">บันทึกรหัสผ่านใหม่</button>
        </div>
    </form>
</div>
{% endblock %}
