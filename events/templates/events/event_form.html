{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-10 p-6 bg-white rounded-lg shadow-xl">
    <h1 class="text-2xl font-bold mb-6">
        {% if object %}
        แก้ไขกิจกรรม
        {% else %}
        สร้างกิจกรรมใหม่
        {% endif %}
    </h1>

    <form method="post">
        {% csrf_token %}
        <div class="space-y-4">
            {{ form.as_p }}
        </div>

        <div class="mt-8">
            <button type="submit" class="btn btn-primary w-full">
                {% if object %}
                บันทึกการเปลี่ยนแปลง
                {% else %}
                สร้างกิจกรรม
                {% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
